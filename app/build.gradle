plugins {
    id 'com.android.application'
}

android {
    namespace 'com.proxsignal.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.proxsignal.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

tasks.register('copyWebAssets', Copy) {
    from(rootProject.file('index.html'))
    into(layout.projectDirectory.dir('src/main/assets'))
    rename { 'index.html' }
}
tasks.named('preBuild').configure { dependsOn('copyWebAssets') }
